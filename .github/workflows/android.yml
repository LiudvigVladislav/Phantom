          phantom.android.transport.AppContainerS6DebugTriggerWiringTest
          phantom.android.transport.ConnectionUiStateTest
          phantom.android.transport.DebugForceMode2ActivityManifestContractTest
          phantom.android.transport.DebugK11_5cTokenLogEnabledReleaseBuildConfigPinTest
          phantom.android.transport.EgressAuthorizationLinearizabilityTest
          phantom.android.transport.GatedAppHttpFailClosedTest
          phantom.android.transport.HybridRelayTransportIntegrationTest20
          phantom.android.transport.HybridRelayTransportMapperTest
          phantom.android.transport.IdleRecoveryCollectorTest
          phantom.android.transport.IdleRecoveryPresentationTest
          phantom.android.transport.KtorRelayTransportProguardNarrowingPinTest
          phantom.android.transport.LongPollOptInOrchestratorSeamTest
          phantom.android.transport.LongPollOptInWireRequestTest
          phantom.android.transport.LongPollV2ReleaseBuildConfigPinTest
          phantom.android.transport.Mode2DebugForceReleaseBuildConfigPinTest
          phantom.android.transport.Mode2FastPathReleaseBuildConfigPinTest
          phantom.android.transport.Mode2StickyReleaseBuildConfigPinTest
          phantom.android.transport.PollSkipLpAndPpReleaseBuildConfigPinTest
          phantom.android.transport.PreviewUrlPolicySsrfTest
          phantom.android.transport.PrivacyModeTeardownTransactionTest
          phantom.android.transport.ProductHttpSinkInventoryTest
          phantom.android.transport.RealOkHttpRevocationTest
          phantom.android.transport.ReconnectQuiescenceReleaseBuildConfigPinTest
          phantom.android.transport.S6ActivityManifestContractTest
          phantom.android.transport.S6BreakerTriggerActivityContractTest
          phantom.android.transport.S6DocsHygieneNegativeGrepTest
          phantom.android.transport.Tele2RunbookPermissionLiteralContractTest
          phantom.android.transport.TransportPreferencesMalformedModeTest
          phantom.android.transport.TransportRewalkCoordinatorTransactionTest
          phantom.android.transport.WsDegradationCollectorBindingsTest
          phantom.android.transport.WsLifecycleCollectorSideEffectsTest
          phantom.android.transport.WsLifecycleDispatchBehaviourTest
          phantom.android.transport.WsSessionLifecycleContractTest
          phantom.android.transport.WsSessionLifecycleDispatcherSequentialOrderTest
          phantom.android.ui.ConnectionBannerErrorLabelTest
          phantom.android.ui.designv2.OnboardingV2RecoverySnapshotTest
          phantom.android.ui.designv2.OnboardingV2ResponsiveMatrixTest
          phantom.android.ui.designv2.OnboardingV2SnapshotTest
          phantom.android.ui.designv2.OnboardingV2Step2AnimationSnapshotTest
          phantom.android.ui.designv2.PhantomAvatarSnapshotTest
          phantom.android.ui.designv2.PhantomBadgeSnapshotTest
          phantom.android.ui.designv2.PhantomButtonSnapshotTest
          phantom.android.ui.designv2.PhantomComponentsSemanticsTest
          phantom.android.ui.designv2.PhantomFilterChipSnapshotTest
          phantom.android.ui.designv2.PhantomIconAuditSnapshotTest
          phantom.android.ui.designv2.PhantomIconContactSheetSnapshotTest
          phantom.android.ui.designv2.PhantomInputSnapshotTest
          phantom.android.ui.designv2.PhantomSegmentedControlSnapshotTest
          phantom.android.ui.designv2.PhantomStressSnapshotTest
          phantom.android.ui.designv2.PhantomToggleSnapshotTest
          phantom.android.ui.designv2.ProfileQrKeyCardSnapshotTest
          phantom.android.ui.designv2.components.PhantomSegmentedControlTouchTargetBoundsTest
          """
          classified = set(l.strip() for l in MANIFEST.splitlines() if l.strip())

          text = open(WORKFLOW, encoding="utf-8").read()

          def section(start, end):
              i = text.index(start)
              j = text.index(end, i)
              return text[i:j]

          jvm = set(re.findall(r'--tests "([^"]+)"', section("\n  android-jvm-state:", "\n  android-compose-ui:")))
          compose = set(re.findall(r"^\s*- (phantom\.[\w.]+)$", section("\n  android-compose-ui:", "\n  android-paparazzi:"), re.M))
          paparazzi = set(re.findall(r'--tests "([^"]+)"', section("\n  android-paparazzi:", "\n  android-test-classification-guard:")))
          for name, lst in (("jvm-state", jvm), ("compose-ui", compose), ("paparazzi", paparazzi)):
              if not lst:
                  print("FAIL -- could not read the %s run list out of %s" % (name, WORKFLOW))
                  sys.exit(1)

          # Units are RUNNABLE declared classes, not file names and not a naming
          # convention: every .kt file under the test root is read, each
          # top-level class is taken with the text up to the next top-level
          # class, and it counts if that text carries a @Test annotation.
          # Gradle's --tests filter selects a class, so a file whose class has
          # another name, a file declaring two test classes, or a class called
          # ...Test20 would otherwise leave a test that is never executed while
          # the inventory looks complete.
          DECL = re.compile(r"^(?:(?:internal|public|private|open|abstract|final)\s+)*(?:data\s+)?class\s+(\w+)", re.M)
          on_disk = set()
          test_named_without_runnable = []
          for d, _, files in os.walk(TEST_ROOT):
              for f in files:
                  if not f.endswith(".kt"):
                      continue
                  path = os.path.join(d, f)
                  text = open(path, encoding="utf-8", errors="replace").read()
                  pkg = re.search(r"^package\s+([\w.]+)", text, re.M)
                  decls = list(DECL.finditer(text))
                  runnable = []
                  for k, dm in enumerate(decls):
                      body = text[dm.start():decls[k + 1].start() if k + 1 < len(decls) else len(text)]
                      if "abstract" in dm.group(0).split("class")[0]:
                          continue
                      if re.search(r"^\s*@(?:org\.junit\.)?Test\b", body, re.M):
                          runnable.append(dm.group(1))
                  if runnable and not pkg:
                      test_named_without_runnable.append(os.path.relpath(path, TEST_ROOT).replace(os.sep, "/") + " (no package line)")
                      continue
                  if not runnable and re.search(r"Test\d*\.kt$", f):
                      test_named_without_runnable.append(os.path.relpath(path, TEST_ROOT).replace(os.sep, "/"))
                      continue
                  for n in runnable:
                      on_disk.add(pkg.group(1) + "." + n)
          # OnboardingV2SemanticsMatchers is a helper with no @Test; it is
          # therefore not a unit, whatever it is called.

          executed = jvm | compose | paparazzi
          problems = []
          def report(title, items):
              if items:
                  problems.append((title, sorted(items)))
          report("files named *Test.kt (or *Test<n>.kt) that declare no runnable class, or lack a package line", set(test_named_without_runnable))
          report("unclassified -- runnable declared test classes missing from the manifest", on_disk - classified)
          report("stale -- manifest entries that no source file declares as a runnable class", classified - on_disk)
          report("declared but never executed -- in the manifest, in no shard run list", classified - executed)
          report("executed but never declared -- in a shard run list, not in the manifest", executed - classified)
          report("in more than one shard", (jvm & compose) | (jvm & paparazzi) | (compose & paparazzi))

          if not problems:
              print("OK -- %d runnable androidUnitTest classes: %d jvm-state, %d compose-ui, %d paparazzi; manifest == executed." % (
                  len(on_disk), len(jvm), len(compose), len(paparazzi)))
              sys.exit(0)
          print("FAIL -- test classification is inconsistent. A class must be in exactly one")
          print("shard run list (android-jvm-state / android-compose-ui / android-paparazzi)")
          print("AND in the manifest of this guard; declaring it does not run it.")
          for title, items in problems:
              print("  %s:" % title)
              for it in items:
                  print("    %s" % it)
          sys.exit(1)
          PY

  # =================================================================
  # 6. assembleDebug + APK artifact. Runs after all test shards succeed.
  # =================================================================
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - shared-core
      - android-jvm-state
      - android-compose-ui
      - android-paparazzi
      - android-test-classification-guard
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: assembleDebug
        run: ./gradlew :apps:android:assembleDebug --stacktrace
      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # =================================================================
  # 7. Aggregate required-check gate. Preserves the branch-protection
  #    name `build-and-test`. `if: always()` + explicit shard-result
  #    check ensures the gate fails (not skips) when any shard fails.
  #    This makes branch-protection semantics unambiguous.
  # =================================================================
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - shared-core
      - android-jvm-state
      - android-compose-ui
      - android-paparazzi
      - android-test-classification-guard
      - assemble-debug
    if: always()
    steps:
      - name: Verify all shards succeeded
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [shared-core]="${{ needs.shared-core.result }}"
            [android-jvm-state]="${{ needs.android-jvm-state.result }}"
            [android-compose-ui]="${{ needs.android-compose-ui.result }}"
            [android-paparazzi]="${{ needs.android-paparazzi.result }}"
            [android-test-classification-guard]="${{ needs.android-test-classification-guard.result }}"
            [assemble-debug]="${{ needs.assemble-debug.result }}"
          )
          fail=0
          for shard in "${!results[@]}"; do
            r="${results[$shard]}"
            if [ "$r" = "success" ]; then
              echo "  OK   $shard"
            else
              echo "  FAIL $shard = $r"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Aggregate build-and-test failed because one or more shards failed."
            exit 1
          fi
          echo ""
          echo "All required Android CI shards passed."

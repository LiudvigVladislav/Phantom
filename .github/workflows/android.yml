# SPDX-License-Identifier: AGPL-3.0-or-later
# Android CI — sharded matrix. See docs/tracks/android-onboarding/c6-onboarding-baseline-landing-contract.md
# §5.0 L2 test-execution note for the rationale behind per-class isolation.
#
# History (2026-08-14 sharding):
#   The previous single-job workflow ran `:apps:android:testDebugUnitTest`
#   monolithically. Two independent CI-infrastructure failures surfaced on
#   the onboarding-baseline-landing branch:
#     1. Compose UI tests (createComposeRule.setContent) hit a documented
#        cumulative AppNotIdleException after enough classes accumulate in
#        one JVM (memory record
#        project_android_test_infra_appnotidleexception_cumulative_2026_08_11).
#        Each class then wastes its 60 s idle timeout; together they
#        exhausted the 30-min job limit.
#     2. Paparazzi 2.0.0-alpha05 on GitHub `ubuntu-24.04` fails to load
#        `layoutlib-runtime-16.2.1-linux/layoutlib_jni.so` with an
#        "undefined symbol" native error. windows-latest loads it cleanly
#        (the same environment where the accepted 98-golden endpoint was
#        recorded).
#
# Shape (2026-08-14):
#   - `shared-core`      — Ubuntu: jvmTest for every shared/core/* module.
#   - `android-jvm-state`— Ubuntu: one Gradle invocation with an explicit
#                          `--tests` filter listing every non-Compose /
#                          non-Paparazzi androidUnitTest class. Includes
#                          Robolectric-runner classes from L1 §5.1
#                          (TransportRewalkCoordinatorTransactionTest,
#                          CallManagerGuardTest,
#                          HybridRelayTransportIntegrationTest20) — those
#                          use `@RunWith(RobolectricTestRunner)` for Log
#                          stubbing, not createComposeRule, so batching is
#                          safe.
#   - `android-compose-ui`— Ubuntu matrix: ONE Gradle invocation per
#                          Compose UI test class (per §5.0). No global
#                          `forkEvery = 1L`; instead every class gets its
#                          own JVM by virtue of being its own workflow
#                          job.
#   - `android-paparazzi`— windows-latest: one scoped `verifyPaparazziDebug`
#                          with `--tests` filter covering all Paparazzi
#                          classes. Verify-only. `recordPaparazziDebug` is
#                          NEVER invoked here.
#   - `android-test-classification-guard`— Ubuntu: fails when a new
#                          *Test.kt appears under androidUnitTest that is
#                          not present in the explicit manifest below.
#                          Forces both the shard list AND the manifest to
#                          be updated together.
#   - `assemble-debug`   — Ubuntu: assembleDebug + APK artifact upload;
#                          runs only after every shard above succeeds.
#   - `build-and-test`   — Ubuntu: aggregate required-check gate with the
#                          same name as before; runs with `if: always()`
#                          and explicitly fails when any shard failed, so
#                          branch protection remains fully wired.
#
# Change policy: do NOT enable global `forkEvery = 1L` (masks leaks,
# doubles wall-clock). Do NOT invoke `recordPaparazziDebug` in this
# workflow. Do NOT upgrade Paparazzi/AGP/Gradle in the CI-repair round.
#
# 2026-09-10: the classification guard now also reads the three run lists
#   out of this file and requires manifest == jvm-state + compose-ui +
#   paparazzi, pairwise disjoint, with every manifest entry backed by a
#   source file. A class that is declared but never executed, or executed
#   but never declared, fails the guard. The 40 classes of the N1
#   consolidation were added to the shards they actually need (38 JVM/
#   Robolectric, 2 Compose UI, 0 Paparazzi). The guard classifies DECLARED
#   runnable classes -- top-level classes whose body carries @Test -- not
#   file names and not a naming convention: a `--tests` filter selects a
#   class, so a file whose class is named differently
#   (AppContainerLastSeenSeqReaderWiringTest.kt declares
#   AppContainerCursorRepositoryWiringTest) or a file with a second test
#   class (OnboardingV2NextLaunchQuarantineTest,
#   OnboardingV2RepairRequiredIntegrationTest) had never actually run, and
#   HybridRelayTransportIntegrationTest20 (file and class both end in
#   `Test20`, one real @Test) must not be dropped by a `*Test` filter.
#   `scripts/tests/test_android_test_classification.py` pins the guard's
#   negative controls.

name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # =================================================================
  # 1. shared/core/* jvmTests + the two enforce-gates. Ubuntu, ~10 min.
  # =================================================================
  shared-core:
    name: Shared core (jvmTest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Test :shared:core:identity (jvm)
        run: ./gradlew :shared:core:identity:jvmTest --stacktrace
      - name: Test :shared:core:crypto (jvm)
        run: ./gradlew :shared:core:crypto:jvmTest --stacktrace
      - name: Test :shared:core:storage (jvm)
        run: ./gradlew :shared:core:storage:jvmTest --stacktrace
      - name: Test :shared:core:transport (jvm)
        run: ./gradlew :shared:core:transport:jvmTest --stacktrace
      - name: Test :shared:core:messaging (jvm)
        run: ./gradlew :shared:core:messaging:jvmTest --stacktrace
      - name: Enforce assertClassifyOnJvmBodiesMatch (transport)
        run: ./gradlew :shared:core:transport:assertClassifyOnJvmBodiesMatch --stacktrace
      - name: Enforce assertSinglePublishBundleImplementation (messaging)
        run: ./gradlew :shared:core:messaging:assertSinglePublishBundleImplementation --stacktrace

  # =================================================================
  # 2. Android JVM/state batch — every androidUnitTest class that does
  #    NOT use `composeTestRule.setContent` and is NOT a Paparazzi test.
  #    One Gradle invocation, one JVM. Safe because the batch does not
  #    accumulate setContent calls.
  # =================================================================
  android-jvm-state:
    name: Android JVM/state batch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Android JVM/state focused batch
        # Explicit --tests filter for every androidUnitTest class that does
        # NOT use `composeTestRule.setContent` and is NOT a Paparazzi test.
        # Includes pre-existing WSS PR #399 diagnostic tests + transport
        # wiring + release-config pins + manifest-contract tests + all L1..L4
        # additions in the JVM/state category, and (2026-09-10) the 38
        # JVM/Robolectric classes of the N1 consolidation: privacy/egress,
        # teardown ownership, delivery full-stack rig, diagnostic journal and
        # network-profile reporter tests. Robolectric-runner classes stay in
        # this batch: they stub Android APIs, they do not call setContent.
        # Kept sorted; verified by android-test-classification-guard, which
        # reads this list back out of the file.
        run: |
          ./gradlew :apps:android:testDebugUnitTest \
            --tests "phantom.android.calls.CallManagerGuardTest" \
            --tests "phantom.android.di.AppContainerCommitWiringTest" \
            --tests "phantom.android.di.PreKeySelfHealHookTest" \
            --tests "phantom.android.di.PrivacyModeTeardownOwnershipTest" \
            --tests "phantom.android.diagnostic.BackgroundEventFilterTest" \
            --tests "phantom.android.diagnostic.BackgroundJournalTest" \
            --tests "phantom.android.diagnostic.DeliverFailedSchemaTest" \
            --tests "phantom.android.diagnostic.DiagnosticCommandReceiverContractTest" \
            --tests "phantom.android.diagnostic.DiagnosticDebugManifestContainsAccessWifiStateTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterCanonicalShapeTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterDenylistedFieldAbsenceTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterDualSimActiveDataSubTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterEgressNon200Test" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterEgressTimeoutTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterExtrasWhitelistTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterFixedOutputPathTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterHmacDeterminismTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterNoActiveNetworkStateTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterSecurityExceptionFailsClosedTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterSourceSetBoundaryTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterVpnActiveStateTest" \
            --tests "phantom.android.diagnostic.DiagnosticNetworkProfileReporterWifiMobileDataTest" \
            --tests "phantom.android.diagnostic.DiagnosticOuterArmObservationTest" \
            --tests "phantom.android.diagnostic.DiagnosticProductionManifestOmitsAccessWifiStateTest" \
            --tests "phantom.android.diagnostic.DiagnosticSendCoordinatorTest" \
            --tests "phantom.android.diagnostic.DiagnosticSourceSetBoundaryTest" \
            --tests "phantom.android.diagnostic.DiagnosticTransportGuardOuterArmMappingTest" \
            --tests "phantom.android.diagnostic.DiagnosticTransportGuardTest" \
            --tests "phantom.android.diagnostic.DiagnosticTransportPinStoreTest" \
            --tests "phantom.android.diagnostic.RcDirectArmGTest" \
            --tests "phantom.android.diagnostic.WssDiagBridgeAdapterTest" \
            --tests "phantom.android.diagnostic.WssDiagInertByDefaultTest" \
            --tests "phantom.android.diagnostics.K8HoldOverrideResolverTest" \
            --tests "phantom.android.messaging.InboundCommitBindingTest" \
            --tests "phantom.android.messaging.OutboundContinuityTest" \
            --tests "phantom.android.messaging.PendingExpiryReceiveTest" \
            --tests "phantom.android.messaging.ReceiveSessionArchiveTest" \
            --tests "phantom.android.messaging.SessionOrderDbSpikeTest" \
            --tests "phantom.android.messaging.SessionOrderFullStackTest" \
            --tests "phantom.android.navigation.ScreenSaverTest" \
            --tests "phantom.android.navigation.StartupRouteResolverTest" \
            --tests "phantom.android.notifications.NotificationsOptInMigrationTest" \
            --tests "phantom.android.screens.onboarding.v2.KeyPreviewAnimationPhaseTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingNotificationPermissionCoordinatorTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingPricingSheetDragGeometryTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingPrivacyModePersistenceTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2FinalizeContractTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2FinalizeOutcomeContractTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2PrivacyFinalizeOrderingTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2StartupPresentationTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2StartupRouteTest" \
            --tests "phantom.android.screens.onboarding.v2.OnboardingV2StateTest" \
            --tests "phantom.android.service.ConnectRetryWiringTest" \
            --tests "phantom.android.service.ServiceStartupTest" \
            --tests "phantom.android.service.TransportNameForOverlayTest" \
            --tests "phantom.android.testing.ModelSnapshotRuleTest" \
            --tests "phantom.android.transport.AppContainerCursorRepositoryWiringTest" \
            --tests "phantom.android.transport.AppContainerDebugForceMode2WiringTest" \
            --tests "phantom.android.transport.AppContainerK8WiringTest" \
            --tests "phantom.android.transport.AppContainerPollSkipLpAndPpGateTest" \
            --tests "phantom.android.transport.AppContainerS6DebugTriggerWiringTest" \
            --tests "phantom.android.transport.ConnectionUiStateTest" \
            --tests "phantom.android.transport.DebugForceMode2ActivityManifestContractTest" \
            --tests "phantom.android.transport.DebugK11_5cTokenLogEnabledReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.EgressAuthorizationLinearizabilityTest" \
            --tests "phantom.android.transport.GatedAppHttpFailClosedTest" \
            --tests "phantom.android.transport.HybridRelayTransportIntegrationTest20" \
            --tests "phantom.android.transport.HybridRelayTransportMapperTest" \
            --tests "phantom.android.transport.IdleRecoveryCollectorTest" \
            --tests "phantom.android.transport.IdleRecoveryPresentationTest" \
            --tests "phantom.android.transport.KtorRelayTransportProguardNarrowingPinTest" \
            --tests "phantom.android.transport.LongPollOptInOrchestratorSeamTest" \
            --tests "phantom.android.transport.LongPollOptInWireRequestTest" \
            --tests "phantom.android.transport.LongPollV2ReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.Mode2DebugForceReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.Mode2FastPathReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.Mode2StickyReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.PollSkipLpAndPpReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.PreviewUrlPolicySsrfTest" \
            --tests "phantom.android.transport.PrivacyModeTeardownTransactionTest" \
            --tests "phantom.android.transport.ProductHttpSinkInventoryTest" \
            --tests "phantom.android.transport.RealOkHttpRevocationTest" \
            --tests "phantom.android.transport.ReconnectQuiescenceReleaseBuildConfigPinTest" \
            --tests "phantom.android.transport.S6ActivityManifestContractTest" \
            --tests "phantom.android.transport.S6BreakerTriggerActivityContractTest" \
            --tests "phantom.android.transport.S6DocsHygieneNegativeGrepTest" \
            --tests "phantom.android.transport.Tele2RunbookPermissionLiteralContractTest" \
            --tests "phantom.android.transport.TransportPreferencesMalformedModeTest" \
            --tests "phantom.android.transport.TransportRewalkCoordinatorTransactionTest" \
            --tests "phantom.android.transport.WsDegradationCollectorBindingsTest" \
            --tests "phantom.android.transport.WsLifecycleCollectorSideEffectsTest" \
            --tests "phantom.android.transport.WsLifecycleDispatchBehaviourTest" \
            --tests "phantom.android.transport.WsSessionLifecycleContractTest" \
            --tests "phantom.android.transport.WsSessionLifecycleDispatcherSequentialOrderTest" \
            --tests "phantom.android.ui.ConnectionBannerErrorLabelTest" \
            --stacktrace

  # =================================================================
  # 3. Android Compose UI matrix — ONE Gradle invocation per test class.
  #    Every class runs in its own worker JVM by virtue of being its own
  #    matrix job; this is the per-class isolation §5.0 requires without
  #    touching build.gradle.kts `forkEvery`.
  # =================================================================
  android-compose-ui:
    name: Android Compose UI (${{ matrix.test-class }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test-class:
          # L1
          - phantom.android.ui.designv2.PhantomComponentsSemanticsTest
          # L2
          - phantom.android.ui.designv2.components.PhantomSegmentedControlTouchTargetBoundsTest
          - phantom.android.screens.onboarding.v2.OnboardingScreenV2GateTest
          - phantom.android.screens.onboarding.v2.OnboardingV2EdgeGestureTest
          - phantom.android.screens.onboarding.v2.OnboardingV2PermissionsSemanticsTest
          - phantom.android.screens.onboarding.v2.OnboardingV2PricingSheetSemanticsTest
          - phantom.android.screens.onboarding.v2.OnboardingV2PrivacyDialSemanticsTest
          - phantom.android.screens.onboarding.v2.OnboardingV2ScrollableCtaReachabilityTest
          - phantom.android.screens.onboarding.v2.OnboardingV2SemanticsTest
          # L3
          - phantom.android.screens.onboarding.v2.IdentityKeyPreviewAnimatedCardTest
          - phantom.android.screens.onboarding.v2.OnboardingV2IdentityRepairMarkerTest
          - phantom.android.screens.onboarding.v2.OnboardingV2ProductionWrapperQuarantineTest
          - phantom.android.screens.onboarding.v2.OnboardingV2RepairRequiredScreenTest
          - phantom.android.screens.onboarding.v2.OnboardingV2StartupErrorScreenTest
          # L4
          - phantom.android.screens.onboarding.v2.FinaleIdentityCreatedTest
          - phantom.android.screens.onboarding.v2.OnboardingFlowV2TransitionTest
          - phantom.android.screens.profile.ProfileQrKeyCardSimplifiedTest
          - phantom.android.navigation.StartupRouteLateWriteIntegrationTest
          # N1 consolidation (2026-09-10): both call createComposeRule +
          # setContent under Robolectric, so they belong to the isolated
          # per-class matrix, not to the shared JVM batch.
          - phantom.android.navigation.NotificationChatNavigationTest
          - phantom.android.screens.settings.MessageAlertsSettingTest
          # 2026-09-10: second test class declared in an already-listed
          # file. A `--tests` filter selects a CLASS, so a file's second
          # class never ran until it was listed by its own name.
          - phantom.android.screens.onboarding.v2.OnboardingV2NextLaunchQuarantineTest
          - phantom.android.screens.onboarding.v2.OnboardingV2RepairRequiredIntegrationTest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Test ${{ matrix.test-class }}
        run: ./gradlew :apps:android:testDebugUnitTest --tests "${{ matrix.test-class }}" --stacktrace

  # =================================================================
  # 4. Paparazzi — windows-latest, verify-only. The GitHub `ubuntu-24.04`
  #    runner cannot load layoutlib-runtime-16.2.1-linux/layoutlib_jni.so
  #    (undefined native symbol); windows-latest loads it cleanly.
  #    `recordPaparazziDebug` is NEVER invoked. If this job fails, STOP
  #    and report — do NOT upgrade Paparazzi/AGP/Gradle in the CI-repair
  #    round.
  # =================================================================
  android-paparazzi:
    name: Android Paparazzi (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: verifyPaparazziDebug (scoped, verify-only)
        run: |
          ./gradlew :apps:android:verifyPaparazziDebug \
            --tests "phantom.android.ui.designv2.PhantomAvatarSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomBadgeSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomButtonSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomFilterChipSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomIconAuditSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomIconContactSheetSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomInputSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomSegmentedControlSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomStressSnapshotTest" \
            --tests "phantom.android.ui.designv2.PhantomToggleSnapshotTest" \
            --tests "phantom.android.ui.designv2.OnboardingV2ResponsiveMatrixTest" \
            --tests "phantom.android.ui.designv2.OnboardingV2SnapshotTest" \
            --tests "phantom.android.ui.designv2.OnboardingV2RecoverySnapshotTest" \
            --tests "phantom.android.ui.designv2.OnboardingV2Step2AnimationSnapshotTest" \
            --tests "phantom.android.ui.designv2.ProfileQrKeyCardSnapshotTest" \
            --stacktrace

  # =================================================================
  # 5. Test classification guard. Enumerates every androidUnitTest *Test.kt
  #    file, collects every RUNNABLE top-level class it DECLARES -- a class
  #    whose body carries @Test, whatever the file or class is called; a
  #    `--tests` filter selects a class, not a file -- reads the three shard
  #    run lists back out of THIS workflow file, and
  #    requires all of the following, or fails red:
  #      - every declared test class is in the manifest below;
  #      - every manifest entry is a declared class (no stale names);
  #      - manifest == jvm-state + compose-ui + paparazzi -- a class that is
  #        declared but not executed, or executed but not declared, fails;
  #      - the three run lists are pairwise disjoint.
  #    New test class -> add it to the shard it needs AND to this manifest.
  #    Declaring a class here does not run it; the run lists are what run.
  # =================================================================
  android-test-classification-guard:
    name: Test classification guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every androidUnitTest test class is classified and executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          WORKFLOW = os.environ.get("PHANTOM_ANDROID_WORKFLOW", ".github/workflows/android.yml")
          TEST_ROOT = os.environ.get("PHANTOM_ANDROID_UNIT_TEST_ROOT", "apps/android/src/androidUnitTest/kotlin")

          # Explicit classification manifest. Must stay in sync with the
          # jobs above; the checks below enforce that mechanically:
          #   - JVM/STATE  -> android-jvm-state.steps (--tests list)
          #   - COMPOSE_UI -> android-compose-ui.strategy.matrix.test-class
          #   - PAPARAZZI  -> android-paparazzi.steps (--tests list)
          MANIFEST = """
          phantom.android.calls.CallManagerGuardTest
          phantom.android.di.AppContainerCommitWiringTest
          phantom.android.di.PreKeySelfHealHookTest
          phantom.android.di.PrivacyModeTeardownOwnershipTest
          phantom.android.diagnostic.BackgroundEventFilterTest
          phantom.android.diagnostic.BackgroundJournalTest
          phantom.android.diagnostic.DeliverFailedSchemaTest
          phantom.android.diagnostic.DiagnosticCommandReceiverContractTest
          phantom.android.diagnostic.DiagnosticDebugManifestContainsAccessWifiStateTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterCanonicalShapeTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterDenylistedFieldAbsenceTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterDualSimActiveDataSubTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterEgressNon200Test
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterEgressTimeoutTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterExtrasWhitelistTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterFixedOutputPathTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterHmacDeterminismTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterNoActiveNetworkStateTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterSecurityExceptionFailsClosedTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterSourceSetBoundaryTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterVpnActiveStateTest
          phantom.android.diagnostic.DiagnosticNetworkProfileReporterWifiMobileDataTest
          phantom.android.diagnostic.DiagnosticOuterArmObservationTest
          phantom.android.diagnostic.DiagnosticProductionManifestOmitsAccessWifiStateTest
          phantom.android.diagnostic.DiagnosticSendCoordinatorTest
          phantom.android.diagnostic.DiagnosticSourceSetBoundaryTest
          phantom.android.diagnostic.DiagnosticTransportGuardOuterArmMappingTest
          phantom.android.diagnostic.DiagnosticTransportGuardTest
          phantom.android.diagnostic.DiagnosticTransportPinStoreTest
          phantom.android.diagnostic.RcDirectArmGTest
          phantom.android.diagnostic.WssDiagBridgeAdapterTest
          phantom.android.diagnostic.WssDiagInertByDefaultTest
          phantom.android.diagnostics.K8HoldOverrideResolverTest
          phantom.android.messaging.InboundCommitBindingTest
          phantom.android.messaging.OutboundContinuityTest
          phantom.android.messaging.PendingExpiryReceiveTest
          phantom.android.messaging.ReceiveSessionArchiveTest
          phantom.android.messaging.SessionOrderDbSpikeTest
          phantom.android.messaging.SessionOrderFullStackTest
          phantom.android.navigation.NotificationChatNavigationTest
          phantom.android.navigation.ScreenSaverTest
          phantom.android.navigation.StartupRouteLateWriteIntegrationTest
          phantom.android.navigation.StartupRouteResolverTest
          phantom.android.notifications.NotificationsOptInMigrationTest
          phantom.android.screens.onboarding.v2.FinaleIdentityCreatedTest
          phantom.android.screens.onboarding.v2.IdentityKeyPreviewAnimatedCardTest
          phantom.android.screens.onboarding.v2.KeyPreviewAnimationPhaseTest
          phantom.android.screens.onboarding.v2.OnboardingFlowV2TransitionTest
          phantom.android.screens.onboarding.v2.OnboardingNotificationPermissionCoordinatorTest
          phantom.android.screens.onboarding.v2.OnboardingPricingSheetDragGeometryTest
          phantom.android.screens.onboarding.v2.OnboardingPrivacyModePersistenceTest
          phantom.android.screens.onboarding.v2.OnboardingScreenV2GateTest
          phantom.android.screens.onboarding.v2.OnboardingV2EdgeGestureTest
          phantom.android.screens.onboarding.v2.OnboardingV2FinalizeContractTest
          phantom.android.screens.onboarding.v2.OnboardingV2FinalizeOutcomeContractTest
          phantom.android.screens.onboarding.v2.OnboardingV2IdentityRepairMarkerTest
          phantom.android.screens.onboarding.v2.OnboardingV2NextLaunchQuarantineTest
          phantom.android.screens.onboarding.v2.OnboardingV2PermissionsSemanticsTest
          phantom.android.screens.onboarding.v2.OnboardingV2PricingSheetSemanticsTest
          phantom.android.screens.onboarding.v2.OnboardingV2PrivacyDialSemanticsTest
          phantom.android.screens.onboarding.v2.OnboardingV2PrivacyFinalizeOrderingTest
          phantom.android.screens.onboarding.v2.OnboardingV2ProductionWrapperQuarantineTest

[package]
name = "phantom-relay"
version = "0.1.0"
edition = "2021"
description = "PHANTOM relay — ciphertext store-and-forward. Stores only encrypted blobs. Never inspects plaintext."

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
futures-util = { workspace = true }
subtle = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
# PR-H1c (2026-05-13): TCP keepalive on the relay's listening socket so
# accepted client connections inherit aggressive keepalive timers (15s
# idle, 5s probe interval, 3 fails before RST). On Linux, SO_KEEPALIVE
# and the TCP_KEEPIDLE/INTVL/CNT options on a listening socket are
# inherited by accept()ed sockets — this gives us per-connection TCP-
# level dead-peer detection without restructuring the axum serve loop.
socket2 = { version = "0.5", features = ["all"] }
# RC-RELAY-STATE-DIR-REPAIR PR-1b §6.2: singleton state-dir lock file
# (`state_dir/.lock`, `try_lock_exclusive`). Second-instance boot exits 2
# instead of racing writes with an already-running relay. Cross-platform:
# fcntl(F_SETLK) on Unix, LockFileEx on Windows.
fs2 = "0.4"
# RC-RELAY-QUEUE-DURABILITY PR-2 M2 (locked design v4 §13 Q7): the
# tempfile crate backs the atomic-write primitive used by
# queue_meta and persistence — NamedTempFile creates a directory-
# scoped file with a randomised name, keeping the same-filesystem
# invariant needed for a POSIX rename to be atomic. Was dev-only
# through PR-1b; promoted to a runtime dependency here because
# on-disk state now writes via NamedTempFile + persist(). M6 will
# add the CI grep-gate against bare `NamedTempFile::new()` (which
# lands in `env::temp_dir()`) and against `env::temp_dir()` direct
# usage so operators cannot accidentally write outside state_dir.
tempfile = "3"
# RC-RELAY-QUEUE-DURABILITY PR-2 M1 §2 / §9 (locked design v4.2 B-5 + v4.1
# V-P0-6): parking_lot::RwLock backs the WorkerPool state machine
# (Running → Closing → Closed) with nanosecond critical sections; the
# GlobalCapacityGate uses a parking_lot::Mutex because CapacityReservation
# needs synchronous Drop-time rollback that a tokio::sync::Mutex would
# force through .await. Already present transitively in Cargo.lock; this
# entry only promotes it to a direct dependency because M1 imports the API.
parking_lot = "0.12"
# RC-RELAY-QUEUE-DURABILITY PR-2 M1 §2 (locked design v4 §2 V-1 +
# v4.1 §2 Q1 boot-random): SipHasher13 with a pair of boot-random
# 64-bit keys backs the `worker_for(recipient)` shard router. Boot-random
# keys close the shard-flood attack surface without coupling shard
# assignment to any operational rotation event.
siphasher = "1"

[dev-dependencies]
tokio-test = { workspace = true }
tower = { workspace = true, features = ["util"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# NB (RC-RELAY-QUEUE-DURABILITY PR-2 M2): the `tempfile` dev-dep
# entry that previously lived here has been promoted to a
# runtime `[dependencies]` entry above so both integration tests
# and the production binary link the same version. Cargo merges
# the two edges automatically; keeping only the prod entry is
# both correct and less noisy.
# PR-0 A-5: config_boot.rs mutates RELAY_STATE_DIR to exercise the
# absolute+no-ParentDir validation. `serial_test` serialises those
# cases across the shared process env — belt-and-braces on top of the
# file-local Mutex inside `with_state_dir`.
serial_test = "3"
